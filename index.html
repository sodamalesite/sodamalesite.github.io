<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SodaMale | Portfolio</title>
    <style>
        :root {
            --bg-color: #08090c;
            --card-bg: #11131a;
            --accent-yellow: #ffee00;
            --yellow-glow: rgba(255, 238, 0, 0.25);
            --accent-steam: #1078ff;
            --accent-yt: #ff0055;
            --text-main: #ffffff;
            --text-muted: #7e8494;
            --border-color: #1f222e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; padding: 50px 20px; -webkit-font-smoothing: antialiased; }
        .container { max-width: 900px; width: 100%; }

        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 30px; border-bottom: 1px solid var(--border-color); margin-bottom: 40px; flex-wrap: wrap; gap: 20px; }
        .profile-info h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 5px; text-transform: uppercase; }
        .profile-info h1 span { color: var(--accent-yellow); text-shadow: 0 0 10px var(--yellow-glow); }
        .profile-info p { color: var(--text-muted); font-size: 0.95rem; font-weight: 500; }
        
        .social-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .btn-social { background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); text-decoration: none; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s ease; cursor: pointer; }
        
        .btn-yt:hover { border-color: var(--accent-yt); box-shadow: 0 0 12px rgba(255, 0, 85, 0.35); color: var(--accent-yt); }
        .btn-steam:hover { border-color: var(--accent-steam); box-shadow: 0 0 12px rgba(16, 120, 255, 0.35); color: #fff; }
        .btn-gb:hover { border-color: var(--accent-yellow); box-shadow: 0 0 12px var(--yellow-glow); color: var(--accent-yellow); }

        .section-title { font-size: 1.25rem; font-weight: 700; margin-top: 40px; margin-bottom: 25px; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; border-left: 3px solid var(--accent-yellow); padding-left: 12px; }
        .portfolio-grid { display: grid; grid-template-columns: 1fr; gap: 25px; }
        @media (min-width: 768px) { .portfolio-grid { grid-template-columns: 1fr 1fr; } }

        .project-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); cursor: pointer; }
        .project-card:hover { border-color: var(--accent-yellow); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 15px var(--yellow-glow); transform: translateY(-2px); }
        
        .image-box { position: relative; width: 100%; background-color: #08090c; border-bottom: 1px solid var(--border-color); }
        .image-box img { width: 100%; height: 100%; object-fit: cover; border: 0; display: block; }
        .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-tag { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; color: var(--accent-yellow); margin-bottom: 6px; letter-spacing: 0.5px; }
        .card-body h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
        .card-body p { color: var(--text-muted); font-size: 0.8rem; line-height: 1.4; margin-bottom: 0; }
        .card-link { margin-top: auto; color: var(--text-main); text-decoration: none; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
        .card-link:hover { color: var(--accent-yellow); }

        .video-thumb {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1d29 0%, #0f1117 100%);
            border-bottom: 1px solid var(--border-color);
        }
        .video-thumb .thumb-content { text-align: center; }
        .video-thumb .thumb-icon { font-size: 2.5rem; margin-bottom: 5px; }
        .video-thumb .thumb-label { color: var(--accent-yt); font-weight: 700; font-size: 0.85rem; }

        .mod-thumb { height: 160px; overflow: hidden; }
        .mod-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .admin-section { display: none; background-color: var(--card-bg); border: 2px dashed var(--accent-yellow); box-shadow: 0 0 20px var(--yellow-glow); border-radius: 12px; padding: 25px; margin-bottom: 40px; }
        .admin-section h2 { font-size: 1.3rem; margin-bottom: 20px; color: var(--accent-yellow); text-transform: uppercase; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .form-group input, .form-group select { background: #07080c; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; color: #fff; font-size: 0.9rem; }
        .form-group input:focus { border-color: var(--accent-yellow); outline: none; box-shadow: 0 0 8px var(--yellow-glow); }
        .btn-submit { background-color: var(--accent-yellow); color: #000; border: none; padding: 14px; border-radius: 8px; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
        
        .loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="profile-info">
                <h1>SodaMale<span>.</span></h1>
                <p>3D Modding & Content Creation</p>
            </div>
            <div class="social-buttons">
                <a class="btn-social btn-yt" target="_blank" href="https://www.youtube.com/@MatveyNotEvrei">🔴 YouTube</a>
                <a class="btn-social btn-steam" target="_blank" href="https://steamcommunity.com/profiles/76561199774041379">🔵 Steam Profile</a>
                <a class="btn-social btn-gb" target="_blank" href="https://gamebanana.com/members/5905088">🍌 GameBanana</a>
            </div>
        </header>

        <div id="adminPanel" class="admin-section">
            <h2>Панель управления портфолио</h2>
            <div class="form-group">
                <label>Тип публикуемого контента</label>
                <select id="contentType" onchange="toggleFormFields()">
                    <option value="mod">Модификация (GameBanana)</option>
                    <option value="video">Видеоролик (YouTube)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Название элемента</label>
                <input type="text" id="contentTitle" placeholder="Например: Gloves Emerald Mod">
            </div>
            <div class="form-group">
                <label>Краткое описание</label>
                <input type="text" id="contentDesc" placeholder="Введите краткое описание работы">
            </div>
            <div class="form-group">
                <label id="urlLabel">Ссылка на страницу мода (GameBanana) или ID видео (YouTube)</label>
                <input type="text" id="contentUrl" placeholder="Пример: https://gamebanana.com... или dQw4w9WgXcQ">
            </div>
            <div class="form-group" id="imageGroup">
                <label>Ссылка на картинку превью (.webp или .jpg)</label>
                <input type="text" id="contentImg" placeholder="Вставьте URL скопированной картинки с GameBanana">
            </div>
            <button class="btn-submit" onclick="addNewContent()">Опубликовать на сайт</button>
        </div>
        
        <main>
            <h2 class="section-title">Модификации</h2>
            <div id="modsGrid" class="portfolio-grid">
                <div class="loading">Загрузка...</div>
            </div>

            <h2 class="section-title">Видеоматериалы</h2>
            <div id="videosGrid" class="portfolio-grid">
                <div class="loading">Загрузка...</div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK (compat версия - работает как обычный скрипт) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // === FIREBASE КОНФИГ (твой) ===
        const firebaseConfig = {
            apiKey: "AIzaSyDRpHx7qFTovQC5-13F4UKbxqAFBruDkyc",
            authDomain: "sodamalesite.firebaseapp.com",
            databaseURL: "https://sodamalesite-default-rtdb.firebaseio.com",
            projectId: "sodamalesite",
            storageBucket: "sodamalesite.firebasestorage.app",
            messagingSenderId: "452781227818",
            appId: "1:452781227818:web:cc63b353f6cc26fec56853"
        };

        // Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const contentRef = db.ref('items');

        // Начальные данные (добавятся в базу только если она пустая)
        const initialContent = [
            {
                type: 'mod',
                title: 'Gloves Emerald Mod',
                desc: 'Качественные изумрудные перчатки для рук в CS 1.6. Полная проработка текстур и оптимизация под классический движок.',
                url: 'https://gamebanana.com',
                img: 'https://gamebanana.com'
            },
            {
                type: 'video',
                title: 'Комбайн сэд стори 2',
                desc: 'Разбор создания быстрых анимаций с помощью Ragdoll Mover в Garry\'s Mod.',
                url: 'JSWGD9hAmNQ'
            }
        ];

        let isAdmin = false;
        let allItems = []; // Массив всех карточек из Firebase

        function toggleFormFields() {
            const type = document.getElementById('contentType').value;
            const imgGroup = document.getElementById('imageGroup');
            const urlLabel = document.getElementById('urlLabel');
            
            if (type === 'video') {
                imgGroup.style.display = 'none';
                urlLabel.innerText = 'ID видео с YouTube (Только буквы и цифры после v=)';
            } else {
                imgGroup.style.display = 'flex';
                urlLabel.innerText = 'Ссылка на страницу мода (GameBanana)';
            }
        }

        // --- ЗАШИФРОВАННАЯ ПРОВЕРКА ПАРОЛЯ ---
        function checkPassword(input) {
            const encrypted = [0x64, 0x64, 0x64, 0x64, 0x64, 0x64];
            const key = 0x55;
            let decrypted = "";
            
            for (let i = 0; i < encrypted.length; i++) {
                decrypted += String.fromCharCode(encrypted[i] ^ key);
            }
            return input === decrypted;
        }

        function checkUrlRoute() {
            if (window.location.hash === '#admin') {
                const password = prompt('Вход в защищенную зону. Введите пароль администратора:');
                
                if (password !== null && checkPassword(password)) {
                    isAdmin = true;
                    document.getElementById('adminPanel').style.display = 'block';
                    toggleFormFields();
                    renderContent();
                    alert('Доступ в панель управления открыт!');
                } else {
                    alert('Неверный пароль!');
                    window.location.hash = '';
                }
            }
        }

        window.addEventListener('hashchange', checkUrlRoute);
        window.addEventListener('load', checkUrlRoute);

        // === ЧИТАЕМ ДАННЫЕ ИЗ FIREBASE В РЕАЛЬНОМ ВРЕМЕНИ ===
        contentRef.on('value', (snapshot) => {
            const data = snapshot.val();
            allItems = [];
            
            if (data) {
                // Преобразуем объект Firebase в массив
                Object.keys(data).forEach(key => {
                    allItems.push({ id: key, ...data[key] });
                });
                
                // Сортируем: новые сверху (по убыванию ключа)
                allItems.sort((a, b) => b.id.localeCompare(a.id));
            } else {
                // Если база пустая - добавляем начальные данные
                initialContent.forEach(item => {
                    contentRef.push(item);
                });
            }
            
            renderContent();
        });

        // === ОТРИСОВКА КАРТОЧЕК ===
        function renderContent() {
            const modsGrid = document.getElementById('modsGrid');
            const videosGrid = document.getElementById('videosGrid');
            
            modsGrid.innerHTML = '';
            videosGrid.innerHTML = '';

            const mods = allItems.filter(item => item.type === 'mod');
            const videos = allItems.filter(item => item.type === 'video');

            if (mods.length === 0) modsGrid.innerHTML = '<div class="loading">Пока нет модификаций</div>';
            if (videos.length === 0) videosGrid.innerHTML = '<div class="loading">Пока нет видео</div>';

            mods.forEach(item => {
                const deleteBtn = isAdmin ? `<button onclick="deleteItem('${item.id}'); event.stopPropagation();" style="background:#ff0055; color:#fff; border:none; padding:5px 10px; border-radius:4px; font-size:0.75rem; cursor:pointer; margin-top:10px; font-weight:bold; align-self:flex-start;">❌ Удалить</button>` : '';

                modsGrid.innerHTML += `
                    <div class="project-card" onclick="window.open('${item.url}', '_blank')">
                        <div class="mod-thumb">
                            <img src="${item.img || item.url}" alt="Mod Image">
                        </div>
                        <div class="card-body">
                            <span class="card-tag">GameBanana</span>
                            <h3>${item.title}</h3>
                            <p>${item.desc}</p>
                            ${deleteBtn}
                        </div>
                    </div>
                `;
            });

            videos.forEach(item => {
                const deleteBtn = isAdmin ? `<button onclick="deleteItem('${item.id}'); event.stopPropagation();" style="background:#ff0055; color:#fff; border:none; padding:5px 10px; border-radius:4px; font-size:0.75rem; cursor:pointer; margin-top:10px; font-weight:bold; align-self:flex-start;">❌ Удалить</button>` : '';

                videosGrid.innerHTML += `
                    <div class="project-card" onclick="window.open('https://www.youtube.com/watch?v=${item.url}', '_blank')">
                        <div class="video-thumb">
                            <div class="thumb-content">
                                <div class="thumb-icon">🎬</div>
                                <div class="thumb-label">YouTube Видео</div>
                            </div>
                        </div>
                        <div class="card-body">
                            <span class="card-tag" style="color: #ff0055;">YouTube Видео</span>
                            <h3>${item.title}</h3>
                            <p>${item.desc}</p>
                            ${deleteBtn}
                        </div>
                    </div>
                `;
            });
        }

        // === УДАЛЕНИЕ ИЗ FIREBASE ===
        window.deleteItem = function(id) {
            if (confirm('Вы уверены, что хотите удалить эту карточку?')) {
                contentRef.child(id).remove()
                    .then(() => alert('Удалено!'))
                    .catch(err => alert('Ошибка: ' + err.message));
            }
        };

        // === ДОБАВЛЕНИЕ В FIREBASE ===
        function addNewContent() {
            const type = document.getElementById('contentType').value;
            const title = document.getElementById('contentTitle').value;
            const desc = document.getElementById('contentDesc').value;
            const url = document.getElementById('contentUrl').value;
            const img = document.getElementById('contentImg').value;

            if (!title || !desc || !url) {
                alert('Заполните обязательные текстовые поля!');
                return;
            }
            if (type === 'mod' && !img) {
                alert('Для модификации обязательно нужно указать ссылку на картинку превью!');
                return;
            }

            const newItem = {
                type: type,
                title: title,
                desc: desc,
                url: url,
                img: type === 'mod' ? img : null,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            };

            contentRef.push(newItem)
                .then(() => {
                    document.getElementById('contentTitle').value = '';
                    document.getElementById('contentDesc').value = '';
                    document.getElementById('contentUrl').value = '';
                    document.getElementById('contentImg').value = '';
                    alert('Контент успешно опубликован!');
                })
                .catch(err => alert('Ошибка: ' + err.message));
        }
    </script>
</body>
</html>
